name: Prune merged branches
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.merged
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Delete a branch only if its tip is exactly the head of a merged PR
      # and no open PR uses it; works for squash merges too.
      - name: Delete merged branches
        run: |
          open=$(gh pr list --state open --limit 1000 --json headRefName --jq '.[].headRefName')
          gh pr list --state merged --limit 1000 \
            --json headRefName,headRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.headRefName) \(.headRefOid)"' |
            sort -u |
            while read -r branch sha; do
              grep -qxF "$branch" <<< "$open" && continue
              tip=$(gh api "repos/$GH_REPO/branches/$branch" --jq .commit.sha 2> /dev/null) || continue
              [ "$tip" = "$sha" ] || continue
              echo "Deleting $branch"
              gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" || true
            done
