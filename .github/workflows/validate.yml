name: Validate
on:
  pull_request:
    branches: [main]
  # Runs on main push the devenv closure to Cachix for PRs without the token
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: mariomarin
          extraPullNames: devenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run checks
        run: >-
          nix run github:cachix/devenv/v2.4.0 -- shell -- prek run --from-ref ${{ github.event.pull_request.base.sha || github.event.before }} --to-ref HEAD
