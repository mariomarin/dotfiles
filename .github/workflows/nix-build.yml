name: Nix Build
on:
  pull_request:
    branches: [main]
    paths:
      - "nix/**"
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Saved by update-deps.yml on main
      - uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('nix/nixos/flake.lock', 'nix/nixos/pkgs/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Evaluate flake outputs
        run: |
          nix eval --raw ./nix/nixos#nixosConfigurations.symbiont.config.system.build.toplevel.drvPath
          nix eval --raw ./nix/nixos#darwinConfigurations.malus.config.system.build.toplevel.drvPath
      - name: Build local packages (checks fixed-output hashes)
        run: nix run nixpkgs#nushell -- .scripts/build-pkgs.nu
