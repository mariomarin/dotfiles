name: Nix Build
on:
  pull_request:
    branches: [main]
    paths:
      - "nix/**"
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: mariomarin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Evaluate flake outputs
        run: |
          nix eval --raw ./nix/nixos#nixosConfigurations.symbiont.config.system.build.toplevel.drvPath
          nix eval --raw ./nix/nixos#darwinConfigurations.malus.config.system.build.toplevel.drvPath
      - name: Build local packages (checks fixed-output hashes)
        run: nix run nixpkgs#nushell -- .scripts/build-pkgs.nu
