name: Update dependencies
on:
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nix
            lockfile: |
              nix/nixos/flake.lock
              nix/nixos/pkgs
            file: flake.lock
          - name: nvim
            lockfile: private_dot_config/nvim/lazy-lock.json
            file: lazy-lock.json
          - name: skills
            lockfile: .claude/skills
            file: skills-lock.json
          # Pins with no lockfile or rolling channel; see updatecli/updatecli.d
          - name: updatecli
            lockfile: |
              .github/workflows
              devenv.nix
              private_dot_local/bin/.chezmoiexternal.toml.tmpl
            file: pinned versions
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.name == 'nix'
        uses: cachix/install-nix-action@v31
      - if: matrix.name == 'nix'
        id: nix-cache
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('nix/nixos/flake.lock', 'nix/nixos/pkgs/**') }}
          paths: ~/.cache/nix
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - if: matrix.name == 'nix'
        run: nix flake update --flake ./nix/nixos
      - if: matrix.name == 'nix'
        id: pkgs
        continue-on-error: true
        run: nix shell nixpkgs#nix-update nixpkgs#nushell -c nu .scripts/update-pkgs.nu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.name == 'nvim'
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - if: matrix.name == 'nvim'
        run: nvim --headless "+Lazy! update" +qa
        env:
          HOME: /root
      - if: matrix.name == 'skills'
        uses: hustcer/setup-nu@v3
      - if: matrix.name == 'skills'
        id: skills
        run: |
          {
            echo 'body<<EOF'
            echo 'Skill text becomes agent instructions: review upstream changes before merging.'
            echo
            nu .scripts/update-skills.nu
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - if: matrix.name == 'updatecli'
        uses: updatecli/updatecli-action@v3.10.0
      - if: matrix.name == 'updatecli'
        run: updatecli pipeline apply --config updatecli/updatecli.d
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.name == 'nix'
        id: check
        continue-on-error: true
        run: |
          nix eval --raw ./nix/nixos#nixosConfigurations.symbiont.config.system.build.toplevel.drvPath
          nix eval --raw ./nix/nixos#darwinConfigurations.malus.config.system.build.toplevel.drvPath
          nix run nixpkgs#nushell -- .scripts/build-pkgs.nu
      # Keyed on the updated lock, so Nix Build on the resulting PR restores it
      - if: matrix.name == 'nix' && steps.nix-cache.outputs.hit-primary-key != 'true'
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('nix/nixos/flake.lock', 'nix/nixos/pkgs/**') }}
          paths: ~/.cache/nix
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - uses: peter-evans/create-pull-request@v8
        id: cpr
        with:
          # GITHUB_TOKEN can't push .github/workflows changes; PR then runs Validate
          token: ${{ matrix.name == 'updatecli' && secrets.UPDATECLI_TOKEN || github.token }}
          commit-message: "chore(${{ matrix.name }}): update ${{ matrix.file }}"
          title: "chore(${{ matrix.name }}): update ${{ matrix.file }}"
          branch: chore/update-${{ matrix.name }}-lock
          delete-branch: true
          body: ${{ steps.skills.outputs.body }}
          # Skills are agent instructions (prompt-injection path): never automerge
          labels: ${{ matrix.name == 'skills' && 'dependencies' || 'dependencies,automerge' }}
          add-paths: ${{ matrix.lockfile }}
      # Bot PRs don't trigger Validate/Automerge; merge here if checks passed
      # updatecli PRs are pushed with a PAT, so Automerge handles them after Validate
      - if: matrix.name != 'skills' && matrix.name != 'updatecli' && steps.cpr.outputs.pull-request-number && steps.check.outcome != 'failure'
        run: gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-url }}"
      - if: steps.check.outcome == 'failure' || steps.pkgs.outcome == 'failure'
        run: exit 1
