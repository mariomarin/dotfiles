# Machine-specific configurations
# This file defines different machine types and their capabilities
# Biology-themed naming convention for all hosts
machines:
  # symbiont - NixOS on WSL (two systems coexisting)
  symbiont:
    type: wsl
    platform: nixos-wsl
    hostname: symbiont
    features:
      desktop: false
      audio: false
      bluetooth: false
      physical_keyboard: false
      kanata: false
      wsl: true
    services:
      - atuin
  # malus - macOS workstation (apple genus)
  malus:
    type: desktop
    platform: darwin
    hostname: malus
    features:
      desktop: true
      audio: true
      bluetooth: true
      physical_keyboard: true
      kanata: true
    services:
      - syncthing
  # prion - Native Windows workstation (self-replicating protein)
  prion:
    type: desktop
    platform: windows
    hostname: prion
    features:
      desktop: true
      audio: true
      bluetooth: true
      physical_keyboard: true
      kanata: true
    services: []
# Default machine type if no match found
default:
  type: unknown
  features:
    desktop: false
    audio: false
    bluetooth: false
    physical_keyboard: false
    kanata: false
  services: []
